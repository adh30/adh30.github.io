name: Fix Prettier

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4

      - name: Run Prettier
        run: |
          npm install -g prettier @shopify/prettier-plugin-liquid
          npx prettier . --write

      - name: Commit fixes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Fix Prettier formatting" || echo "Nothing to commit"
          git push
